# Producción (VM de Google Cloud): docker compose -f infra/docker-compose.prod.yml --env-file .env up -d --build
name: qullqa-prod
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - qullqa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  api:
    build: { context: .., target: api }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      API_PORT: 3000
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-}
      PC_SDK_SUBSCRIPTION_KEY: ${PC_SDK_SUBSCRIPTION_KEY:-}
      METEOMATICS_USERNAME: ${METEOMATICS_USERNAME:-}
      METEOMATICS_PASSWORD: ${METEOMATICS_PASSWORD:-}
      ADMIN_PHONES: ${ADMIN_PHONES:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: { context: .., target: worker }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_started } # la API aplica las migraciones

  # Respaldo diario de la base en la VM (/var/backups/qullqa); se conservan los de los últimos 30 días.
  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - /var/backups/qullqa:/backups
    entrypoint: ["sh", "-c", "while true; do pg_dump -Fc -f /backups/qullqa-$$(date +%Y%m%d-%H%M).dump && echo respaldo-ok; find /backups -name 'qullqa-*.dump' -mtime +30 -delete; sleep 86400; done"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: .., target: web }
    restart: unless-stopped
    environment:
      DOMAIN: ${PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

volumes:
  qullqa_pg:
  caddy_data:
  caddy_config:
